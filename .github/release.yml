---
changelog:
  categories:
    - title: "⚠️ Breaking Changes"
      labels:
        - breaking-change
        - breaking
    - title: "✨ New Features"
      labels:
        - enhancement
        - feature
    - title: "🐛 Bug Fixes"
      labels:
        - bug
        - fix
    - title: "📦 Dependency Updates"
      labels:
        - dependencies
  exclude:
    labels:
      - ignore-for-release
